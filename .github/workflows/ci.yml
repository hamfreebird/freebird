name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format check
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Build (release)
        run: cargo build --release
      - name: Test
        run: cargo test
      - name: Documentation links
        run: python3 scripts/check-doc-links.py
      - name: Examples smoke test
        run: |
          for file in examples/*.fb; do
            ./target/release/freebird run "$file" > /dev/null
            ./target/release/freebird build --target stardust "$file" > /dev/null
          done

  differential:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: VM/Stardust differential tests
        run: cargo test --test differential_test

  llvm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install LLVM/clang
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: LLVM backend tests (bundled Stardust toolchain)
        run: cargo test --test m3_test
