name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check tag matches Cargo.toml version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$TAG" != "$VERSION" ]; then
            echo "tag $TAG does not match Cargo.toml version $VERSION"
            exit 1
          fi
      - name: Build (release)
        run: cargo build --release
      - name: Package
        run: |
          cp target/release/freebird freebird-linux-x86_64
          sha256sum freebird-linux-x86_64 > freebird-linux-x86_64.sha256
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            freebird-linux-x86_64
            freebird-linux-x86_64.sha256
