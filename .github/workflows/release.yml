name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build (release)
        run: cargo build --release
      - name: Package
        run: |
          cp target/release/freebird freebird-linux-x86_64
          sha256sum freebird-linux-x86_64 > freebird-linux-x86_64.sha256
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            freebird-linux-x86_64
            freebird-linux-x86_64.sha256
